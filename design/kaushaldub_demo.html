<title>KaushalDub Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&display=swap">
<style>
/* Layout: one app shell (top bar, role nav, content). Calm teal workspace, amber for attention. */
:root{
  --bg:#F3F6F8;--surface:#FFFFFF;--ink:#12212B;--muted:#4F6170;--line:#D6DFE5;
  --brand:#0B6E6E;--brand-ink:#FFFFFF;--brand-soft:#DDF1F0;
  --accent:#9A4A06;--accent-soft:#FCEBD3;
  --good:#1B7338;--good-soft:#DDF3E4;--bad:#B42318;--bad-soft:#FDE4E1;
  --vid:#0E1A22;
  --f-display:'Sora','Noto Sans',system-ui,sans-serif;
  --f-body:'Noto Sans','Noto Sans Devanagari','Noto Sans Kannada',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C151B;--surface:#14212A;--ink:#E7EEF2;--muted:#9FB3C0;--line:#273740;
  --brand:#52C7C2;--brand-ink:#04201F;--brand-soft:#123635;
  --accent:#F2A855;--accent-soft:#3A2A12;
  --good:#5AD18A;--good-soft:#12301F;--bad:#FF9082;--bad-soft:#3A1A17;--vid:#060C10;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C151B;--surface:#14212A;--ink:#E7EEF2;--muted:#9FB3C0;--line:#273740;
  --brand:#52C7C2;--brand-ink:#04201F;--brand-soft:#123635;
  --accent:#F2A855;--accent-soft:#3A2A12;
  --good:#5AD18A;--good-soft:#12301F;--bad:#FF9082;--bad-soft:#3A1A17;--vid:#060C10;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(26px,4vw,38px)}h2{font-size:22px}h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-size:15px}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.nav button.on{color:var(--brand);border-color:var(--brand)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
/* role screen */
.hero{padding:56px 0 28px;max-width:720px}
.hero p{margin-top:12px;font-size:17px;color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}
.role{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.role:hover{border-color:var(--brand);transform:translateY(-2px)}
.role .ico{width:44px;height:44px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.role .ico svg{width:24px;height:24px}
.role ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
/* login */
.login{max-width:420px;margin:48px auto;text-align:center}
.gbtn{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:48px;display:flex;gap:12px;align-items:center;justify-content:center;font-weight:600;margin-top:20px}
.gbtn:hover{border-color:var(--brand)}
.acct{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;margin-top:10px}
.acct:hover{border-color:var(--brand)}
/* upload */
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.drop{border:2px dashed var(--line);border-radius:12px;min-height:200px;display:grid;place-items:center;text-align:center;padding:24px;background:var(--bg)}
.drop.has{border-style:solid;border-color:var(--brand);background:var(--brand-soft)}
label.l{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
select,input[type=text],input[type=search],input[type=password],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:72px;line-height:1.5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;min-height:36px;font-weight:600;font-size:14px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
/* pipeline stepper */
.pipe{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.pipe span{flex:1;min-width:92px;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.pipe span.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.pipe span.done{color:var(--good)}
/* progress */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .6s ease}
.stage{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border:0}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--good)}
.stage.run .dot{border-color:var(--brand);border-top-color:transparent;animation:sp 0.9s linear infinite}
.stage.done .dot{border-color:var(--good);background:var(--good-soft)}
.stage.wait{opacity:.55}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.stage.run .dot{animation:none}.bar i{transition:none}.role{transition:none}}
/* player */
.vp{position:relative;background:var(--vid);border-radius:12px;overflow:hidden}
.vp video{display:block;width:100%;aspect-ratio:16/9;background:var(--vid)}
.cap{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;max-width:90%;background:rgba(0,0,0,.78);color:#fff;padding:5px 12px;border-radius:6px;font-size:15px;text-align:center}
.vc{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0E1A22;color:#fff}
.vc button{background:none;border:0;color:#fff;min-width:36px;min-height:36px;display:grid;place-items:center;border-radius:6px}
.vc button:hover{background:rgba(255,255,255,.14)}
.vc .tm{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.seekw{position:relative;flex:1;height:36px;display:flex;align-items:center;min-width:0}
.seekw input{width:100%;accent-color:#52C7C2;position:relative;z-index:1;background:none}
.tick{position:absolute;top:8px;bottom:8px;width:2px;background:rgba(255,255,255,.55);pointer-events:none}
.vp .narr{font-size:12px;font-weight:600;padding:4px 10px;border:1px solid rgba(255,255,255,.4);border-radius:99px;width:auto;min-width:0}
.vp .narr.on{background:#52C7C2;color:#04201F;border-color:#52C7C2}
.watermark{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
/* steps */
.step{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.step.on{border-color:var(--brand);background:var(--brand-soft)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.step.on .n{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.step.done .n{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.edit{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.edit.on{border-color:var(--brand)}
.edit.low{border-color:var(--accent)}
/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.vcard:hover{border-color:var(--brand)}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;color:#fff;position:relative}
.thumb svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:1.6;opacity:.9}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);font-size:12px;padding:1px 7px;border-radius:5px}
.vcard .b{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
/* quiz */
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;min-height:48px;margin-top:10px}
.opt:hover{border-color:var(--brand)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
/* annotator timeline */
.tl{display:flex;height:52px;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative}
.seg{border:0;border-right:2px solid var(--surface);color:#fff;font-weight:600;font-size:12px;display:grid;place-items:center;padding:0 4px;overflow:hidden;white-space:nowrap;min-width:0;border-radius:0}
.seg.sel{outline:3px solid var(--ink);outline-offset:-3px}
.head{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px #000;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;max-width:92vw;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{font-family:var(--f-display);font-size:26px;display:block;font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:4px 0}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--surface);font-size:12px;margin-left:6px;font-weight:700}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.plan{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);cursor:pointer}
.plan.on{border-color:var(--brand);background:var(--brand-soft)}
.plan.off{cursor:default;opacity:.85}
.plan input{width:18px;height:18px;accent-color:var(--brand)}
.keyrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 14px}
.chg{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.chg input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
.tlab{font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 4px}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.id);toast.id=setTimeout(()=>t.hidden=true,2600)}
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* ---------- narration ---------- */
function speak(k){
  if(!S.narr||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const code=SPEECH[S.lang],vs=speechSynthesis.getVoices();
    const v=vs.find(x=>x.lang.replace('_','-').toLowerCase()===code.toLowerCase())||vs.find(x=>x.lang.toLowerCase().startsWith(S.lang));
    if(!v&&S.lang!=='en'){if(!speak.warned){speak.warned=1;toast('No '+LNE[S.lang]+' voice on this device. Showing captions only.')}return}
    const u=new SpeechSynthesisUtterance(S.steps[S.lang][k]);u.lang=code;if(v)u.voice=v;u.rate=.88;speechSynthesis.speak(u);
  }catch(e){}
}

function bindPlayer(on){
  const v=$('#vid');if(!v)return;P.k=-1;
  const setCap=k=>{$('#cap').textContent=S.steps[S.lang][k]||''};
  const sync=()=>{
    const t=v.currentTime,d=v.duration||25,k=Math.min(4,Math.floor(t/5));
    $('#tm').textContent=fmt(t)+' / '+fmt(d);$('#seek').value=t/d*1000;
    if(k!==P.k){P.k=k;setCap(k);$$('[data-step]').forEach(e=>{const i=+e.dataset.step;e.classList.toggle('on',i===k);e.classList.toggle('done',i<k)});if(on)on(k);if(!v.paused)speak(k)}
  };
  v.addEventListener('timeupdate',sync);v.addEventListener('loadedmetadata',sync);
  v.addEventListener('play',()=>{$('#ppb').innerHTML=ic('pause');speak(Math.min(4,Math.floor(v.currentTime/5)))});
  v.addEventListener('pause',()=>{$('#ppb').innerHTML=ic('play');try{speechSynthesis.cancel()}catch(e){}});
  v.addEventListener('ended',()=>{try{speechSynthesis.cancel()}catch(e){}});
  $('#seek').addEventListener('input',e=>{v.currentTime=e.target.value/1000*(v.duration||25)});
  P.refresh=()=>{P.k=-1;sync()};setCap(0);
}

function render(){
  clr();const v=S.view;let h=V[v]();
  $('#app').innerHTML=(v==='role'||v==='login')?h:shell(h);scrollTo(0,0);after(v);
}
function go(v){S.view=v;render()}
function runStages(next,total){
  const n=$$('.stage').length,step=total/n;let i=0;
  const tick=()=>{ if(i>0){const p=$('#st'+(i-1));p&&(p.className='stage done')}
    if(i>=n){$('#pb').style.width='100%';later(next,500);return}
    $('#st'+i).className='stage run';$('#pb').style.width=((i+.5)/n*100)+'%';i++;later(tick,step)};
  tick();
}
function after(v){
  if(v==='t-process')runStages(()=>go('t-review'),9000);
  if(v==='t-dub')runStages(()=>go('t-result'),4800);
  if(v==='t-review'||v==='t-result'||v==='l-watch')bindPlayer();
  if(v==='a-label')bindPlayer(()=>{});
  if(v==='a-label'){const vd=$('#vid');vd.addEventListener('timeupdate',()=>{const h=$('#head');if(h)h.style.left=(vd.currentTime/(vd.duration||25)*100)+'%'})}

  if(v==='l-lib'){const s=$('#srch');s.oninput=e=>{S.search=e.target.value;const q=S.search.toLowerCase(),f=S.filter||'All';$('#libgrid').innerHTML=libCards(LIB.filter(x=>(f==='All'||x.d===f)&&(!q||(x.t+' '+x.d+' '+x.by).toLowerCase().includes(q))))}}

  if(v==='t-settings'){$$('input[name=plan]').forEach(r=>r.onchange=e=>{S.plan.mode=e.target.value;render()});
    ['sarvam','gemini','groq'].forEach(k=>{const i=$('#key_'+k);if(i)i.oninput=e=>{S.plan.keys[k]=e.target.value.trim();S.plan.tested[k]=false}});

  if(v==='a-label'){const l=$('#lab');l.onchange=e=>{S.segs[S.sel].l=e.target.value;S.segs[S.sel].ok=true;render()}}

 plang:el=>{S.lang=el.dataset.v;const k=P.k;const v=$('#vid');const playing=v&&!v.paused;
   if(S.view==='t-review'){render()}else{ $$('[data-act=plang]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.lang));
     $$('[data-step] .muted[lang]').forEach((e,i)=>{e.lang=S.lang;e.textContent=S.steps[S.lang][i]});$('#cap').textContent=S.steps[S.lang][Math.max(0,k)];if(playing)speak(Math.max(0,k))}},
 rtab:el=>{S.tab=el.dataset.v;render()},
 regen:()=>toast('Quiz regenerated from the reviewed steps'),
 approve:()=>go('t-dub'),
 publish:()=>{S.published=true;S.hist.trainer.unshift({t:S.draft.title,d:S.draft.domain,l:['EN',...S.draft.langs.map(l=>l.toUpperCase())].join(' · '),s:'Published',w:'Just now'});toast('Published to the learner library');render()},
 dl:()=>toast('Demo build: downloads are disabled'),
 openhist:()=>{go('t-result')},
 pp:()=>{const v=$('#vid');v.paused?v.play().catch(()=>{}):v.pause()},
 narr:()=>{S.narr=!S.narr;const b=$('#narrb');b.className='narr '+(S.narr?'on':'');b.innerHTML=ic('vol')+'&nbsp;Narration '+(S.narr?'on':'off');if(!S.narr){try{speechSynthesis.cancel()}catch(e){}}else{const v=$('#vid');if(v&&!v.paused)speak(Math.max(0,P.k))}},
 seekstep:el=>seekStep(+el.dataset.v),
 filt:el=>{S.filter=el.dataset.v;render()},
 watch:el=>{S.cur=LIB.find(x=>x.id==el.dataset.v)||LIB[0];go('l-watch')},
 startquiz:()=>{S.q={i:0,score:0,p:null};go('l-quiz')},
 qlang:el=>{S.lang=el.dataset.v;render()},
 ans:el=>{const z=S.q,j=+el.dataset.v;z.p=j;if(j===QZ[S.lang][z.i].a)z.score++;render()},
 next:()=>{S.q.i++;S.q.p=null;if(S.q.i>=QZ.en.length){S.hist.learner.unshift({t:S.cur.t,w:'Just now',p:100,sc:S.q.score+'/'+QZ.en.length})}render()},
 alabel:()=>{resetSegs();go('a-label')},
 selseg:el=>{S.sel=+el.dataset.v;const g=S.segs[S.sel];render();const v=$('#vid');if(v)v.currentTime=g.s+.05},
 seekseg:()=>{const g=S.segs[S.sel],v=$('#vid');v.currentTime=g.s+.05;v.play().catch(()=>{});const stop=()=>{if(v.currentTime>=g.e){v.pause();v.removeEventListener('timeupdate',stop)}};v.addEventListener('timeupdate',stop)},
 split:()=>{const v=$('#vid'),t=Math.round(v.currentTime*10)/10,g=S.segs[S.sel];if(t<=g.s+.5||t>=g.e-.5){toast('Move the playhead inside the selected segment first');return}
   S.segs.splice(S.sel,1,{...g,e:t,ok:false},{...g,s:t,ok:false});render()},
 merge:()=>{const a=S.segs[S.sel],b=S.segs[S.sel+1];S.segs.splice(S.sel,2,{...a,e:b.e,ok:false});render()},
 accept:()=>{S.segs[S.sel].ok=true;if(S.sel<S.segs.length-1)S.sel++;render()},
 unclear:()=>{S.segs[S.sel].l='No action';S.segs[S.sel].ok=true;toast('Marked unclear. A reviewer will look at it.');render()},
 asubmit:()=>{const id=Math.max(0,...S.annReq.map(r=>r.id))+1;
   S.annReq.unshift({id,clip:'Seam stitching · clip 21',video:'Basic seam stitching',by:S.user.name+' (annotator)',w:'Just now',status:'Pending',note:'',
     model:[['Measure',0,5,.92],['Mark',5,10,.89],['Cut',10,15,.85],['Stitch',15,20,.55],['Stitch',20,25,.9]],segs:S.segs.map(x=>[x.l,x.s,x.e])});
   S.hist.annotator.unshift({t:'Seam stitching · clip 21',n:S.segs.length,w:'Just now',s:'Pending',req:id});toast('Sent to the trainer for approval');go('a-history')},
 report:()=>{const vd=$('#vid');if(vd)vd.pause();S.rep={t:vd?vd.currentTime:0,cat:'Wrong step',msg:''};render()},
 repclose:()=>{S.rep=null;render()},
 repnow:()=>{const vd=$('#vid');if(!vd)return;S.rep.t=vd.currentTime;$('#rept').textContent=fmt(S.rep.t);$('#repstep').textContent='Step '+(stepAt(S.rep.t)+1)+' · '+TITLES[stepAt(S.rep.t)]},
 repcat:el=>{S.rep.cat=el.dataset.v;$$('[data-act=repcat]').forEach(b=>b.classList.toggle('on',b===el))},
 repsend:()=>{const R=S.rep;if(!(R.msg||'').trim()){toast('Add a short message so the trainer knows what to fix');$('#repmsg').focus();return}
   const id=Math.max(0,...S.tickets.map(t=>t.id))+1;
   S.tickets.unshift({id,video:S.cur.t,t:Math.round(R.t),lang:S.lang,cat:R.cat,msg:R.msg.trim(),by:S.user.name+' (learner)',mine:true,status:'Open',w:'Just now',reply:''});
   S.rep=null;render();toast('Report sent to the trainer')},
 tfilt:el=>{S.tf=el.dataset.v;render()},
 openticket:el=>{S.tk=+el.dataset.v;const t=S.tickets.find(x=>x.id===S.tk);S.lang=t.lang;go('t-ticket')},
 tkplay:()=>{const t=S.tickets.find(x=>x.id===S.tk),vd=$('#vid');vd.currentTime=t.t;vd.play().catch(()=>{})},
 tkregen:()=>{const t=S.tickets.find(x=>x.id===S.tk),k=stepAt(t.t);S.steps[t.lang][k]=$('#fixtext').value;P.refresh&&P.refresh();toast('Voice re-made for step '+(k+1)+' in '+LNE[t.lang])},
 tkresolve:()=>{const t=S.tickets.find(x=>x.id===S.tk),k=stepAt(t.t);S.steps[t.lang][k]=$('#fixtext').value;t.reply=$('#tkreply').value.trim()||'Fixed the step at '+fmt(t.t)+'.';t.status='Resolved';toast('Fix saved and report closed');render()},
 tkwont:()=>{const t=S.tickets.find(x=>x.id===S.tk);t.reply=$('#tkreply').value.trim()||'Checked: no change needed.';t.status='Closed';toast('Report closed');render()},
 openreq:el=>{S.rq=+el.dataset.v;go('t-annreview')},
 chgplay:el=>{const vd=$('#vid');vd.currentTime=+el.dataset.v+.05;vd.play().catch(()=>{})},
 rqapprove:()=>{const r=S.annReq.find(x=>x.id===S.rq),ch=annChanges(r),ok=$$('.chg input').filter(i=>i.checked).length;
   r.note=$('#rqnote').value;r.status=ok===ch.length?'Approved':ok?'Partly approved':'Closed';S.learning.pending+=ok;
   const h=S.hist.annotator.find(x=>x.req===r.id);if(h)h.s=ok?'Accepted':'Changes asked';
   toast(ok?`${ok} correction${ok>1?'s':''} applied to the video and added to the model’s memory`:'No changes approved');render()},
 rqreject:()=>{const r=S.annReq.find(x=>x.id===S.rq);r.note=$('#rqnote').value;r.status='Sent back';const h=S.hist.annotator.find(x=>x.req===r.id);if(h)h.s='Changes asked';toast('Sent back to the annotator');render()},
 retrain:()=>{toast('Retraining on '+S.learning.pending+' new corrections (simulated)');setTimeout(()=>{const L=S.learning;L.memory+=L.pending;L.pending=0;L.version++;L.last='Just now';if(S.view==='t-ann')render();toast('Step model v'+L.version+' is live')},2500)},
 testkey:el=>{const k=el.dataset.v,val=S.plan.keys[k]||'';if(val.length<12){toast('That key looks too short. Paste the full key.');return}S.plan.tested[k]=true;toast('Demo: key format looks right (nothing was sent)');render()},
 savesettings:()=>{if(S.plan.mode==='byok'&&!keysReady()){toast('Add a Sarvam key and a Gemini or Groq key');return}toast('Settings saved');go('t-home')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.disabled&&A[el.dataset.act])A[el.dataset.act](el)});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
render();
</script>
